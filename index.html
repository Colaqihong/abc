<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing Practice - A to Z</title>
<style>
    body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #a8e6cf, #dcedc1); text-align:center; padding:20px; margin: 0; min-height: 100vh;}
    .container { max-width:500px; margin:auto; background:#ffffffee; padding:25px; border-radius:15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    h1 { margin-top: 0; color: #333; }
    
    /* 专门为单字母设计的正方形画板 */
    .trace-area { position:relative; width:250px; height:250px; margin:30px auto; background: #fff; border-radius: 15px; box-shadow: inset 0 0 10px rgba(0,0,0,0.05);}
    .trace-guide { position:absolute; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:180px; font-family: 'Comic Sans MS', sans-serif; font-weight:bold; color:transparent; -webkit-text-stroke:3px #ccc; user-select: none;}
    #traceCanvas { position:absolute; top:0; left:0; width:250px; height:250px; z-index:2; border:2px dashed #bbb; border-radius: 15px; cursor: crosshair;}
    
    button { padding:12px 20px; margin:5px; border-radius:8px; border:none; cursor:pointer; font-weight:bold; font-size: 16px; transition: 0.2s;}
    button:active { transform: scale(0.95); }
    .check-btn { background:#4CAF50;color:white; }
    .clear-btn { background:#E74C3C;color:white; }
    .nav-btn { background:#3498DB;color:white; padding: 10px 15px;}
    .nav-btn:disabled { background:#95a5a6; cursor:not-allowed; transform: none; }
    
    .result { font-size:28px; margin-top:15px; height: 35px; font-weight: bold;}
    .controls { margin-top: 15px; }
    .navigation { display: flex; justify-content: space-between; margin-top: 15px;}
</style>
</head>
<body>
<div class="container">
    <h1 id="title">Writing Practice ✨</h1>

    <div class="trace-area">
        <div class="trace-guide" id="traceGuide">A</div>
        <canvas id="traceCanvas" width="250" height="250"></canvas>
    </div>

    <div class="controls">
        <button class="check-btn" onclick="checkWriting()">✔ Check</button>
        <button class="clear-btn" onclick="clearCanvas()">✖ Clear</button>
    </div>

    <div id="result" class="result"></div>

    <hr style="border:0; border-top:1px solid #ddd; margin:20px 0;">

    <div class="navigation">
        <button class="nav-btn" id="prevBtn" onclick="prevLetter()">⬅️ Previous</button>
        <button class="nav-btn" id="nextBtn" onclick="nextLetter()">Next ➡️</button>
    </div>
</div>

<script>
// 自动生成 A 到 Z 的字母列表
const alphabetData = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
let currentIndex = 0;

// 画布设置
const canvas = document.getElementById("traceCanvas");
const ctx = canvas.getContext("2d");
let drawing=false, totalLength=0, lastX=0, lastY=0;
ctx.lineWidth=8; // 笔画稍微加粗一点，写单字母更好看
ctx.lineCap="round";
ctx.lineJoin="round";
ctx.strokeStyle="#333";

// 音频设置 (需要确保你的目录下有这两个文件)
const successAudio = new Audio('button-37a.mp3');
const failAudio = new Audio('beep-03.mp3');

function playSuccessSound(){ successAudio.currentTime=0; successAudio.play().catch(e=>console.log("Playback failed:", e)); }
function playFailSound(){ failAudio.currentTime=0; failAudio.play().catch(e=>console.log("Playback failed:", e)); }

// 加载当前字母
function loadCurrentLetter() {
    const currentLetter = alphabetData[currentIndex];
    
    // 更新标题和背景字
    document.getElementById("title").innerHTML = `Writing Practice '${currentLetter}'`;
    document.getElementById("traceGuide").innerText = currentLetter;
    
    // 控制上一页/下一页按钮的开关
    document.getElementById("prevBtn").disabled = (currentIndex === 0);
    document.getElementById("nextBtn").disabled = (currentIndex === alphabetData.length - 1);
    
    // 切换字母时清空画板
    clearCanvas();
}

// 翻页功能
function prevLetter() {
    if (currentIndex > 0) {
        currentIndex--;
        loadCurrentLetter();
    }
}

function nextLetter() {
    if (currentIndex < alphabetData.length - 1) {
        currentIndex++;
        loadCurrentLetter();
    }
}

// 绘画逻辑
function drawLine(x,y){ 
    let dx = x - lastX; 
    let dy = y - lastY; 
    totalLength += Math.sqrt(dx*dx + dy*dy); 
    ctx.lineTo(x,y); 
    ctx.stroke(); 
    lastX = x; 
    lastY = y; 
}

// 鼠标操作 (电脑)
canvas.addEventListener("mousedown", e => { drawing=true; lastX=e.offsetX; lastY=e.offsetY; ctx.beginPath(); ctx.moveTo(lastX,lastY); });
canvas.addEventListener("mousemove", e => { if(drawing) drawLine(e.offsetX,e.offsetY); });
canvas.addEventListener("mouseup", () => drawing=false);
canvas.addEventListener("mouseleave", () => drawing=false);

// 触摸操作 (手机/平板)
canvas.addEventListener("touchstart", e => {
    e.preventDefault(); // 防止屏幕跟着滚动
    const touch = e.touches[0]; 
    const rect = canvas.getBoundingClientRect(); 
    drawing = true; 
    lastX = touch.clientX - rect.left; 
    lastY = touch.clientY - rect.top; 
    ctx.beginPath(); 
    ctx.moveTo(lastX,lastY);
}, {passive: false});

canvas.addEventListener("touchmove", e => {
    if(!drawing) return; 
    e.preventDefault(); 
    const touch = e.touches[0]; 
    const rect = canvas.getBoundingClientRect(); 
    drawLine(touch.clientX - rect.left, touch.clientY - rect.top);
}, {passive: false});

canvas.addEventListener("touchend", () => drawing=false);
canvas.addEventListener("touchcancel", () => drawing=false);

// 清空画板
function clearCanvas(){ 
    ctx.clearRect(0,0,canvas.width,canvas.height); 
    totalLength = 0; 
    document.getElementById("result").innerText = ""; 
}

// 检查书写 (判断标准针对单个字母)
function checkWriting(){
    const result = document.getElementById("result");
    
    if(totalLength > 350){
        result.innerHTML = "Well done! 🎉";
        result.style.color = "green";
        playSuccessSound();
    } else {
        result.innerHTML = "Try again 😢";
        result.style.color = "red";
        playFailSound();
    }
}

// 网页加载完成后，初始化第一个字母 (A)
window.onload = loadCurrentLetter;

</script>
</body>
</html>
